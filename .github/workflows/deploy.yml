name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # jsdom 30 needs Node ^22.22.2, ^24.15.0 or >=26.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # A failing test blocks the deploy; pull requests are tested but never deployed.
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Let a running deploy finish; queue at most one more.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # hangman.html is fully self-contained, so the whole site is one file
      # served as the index.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp hangman.html _site/index.html
          cp hangman.html _site/hangman.html

      # enablement: true turns Pages on for the repo if it is not already,
      # so no manual Settings step is needed for a fresh repo.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
