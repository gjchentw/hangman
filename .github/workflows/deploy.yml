name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # hangman.html is fully self-contained, so the whole site is one file
      # served as the index.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp hangman.html _site/index.html
          cp hangman.html _site/hangman.html

      # enablement: true turns Pages on for the repo if it is not already,
      # so no manual Settings step is needed for a fresh repo.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
