<!DOCTYPE html>
<html lang="zh-Hant" data-variant="cloze">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangman 單字遊戲</title>
<script>if (document.documentElement.dataset.variant === "cloze") document.title = "Hangman 克漏字";</script>
<style>
  :root {
    --bg: #11151c;
    --surface: #1a212c;
    --surface-2: #232c3a;
    --border: #33404f;
    --text: #e7edf5;
    --muted: #93a3b8;
    --accent: #5db4f5;
    --good: #46c88a;
    --bad: #f0616d;
    --warn: #f2b45c;
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  /* Both games are built from this file; data-variant is set at build time,
     so each shows only its own wording with no flash of the other's. */
  [data-variant="cloze"] .only-plain,
  [data-variant="plain"] .only-cloze { display: none; }

  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    display: flex;
    justify-content: center;
  }

  main { width: 100%; max-width: 780px; }

  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: .02em;
  }

  .sub { color: var(--muted); font-size: .875rem; margin: 0 0 24px; }

  section { display: none; }
  section.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  label { display: block; font-weight: 600; margin-bottom: 8px; }
  .hint { color: var(--muted); font-size: .8125rem; font-weight: 400; margin-bottom: 10px; }

  textarea {
    width: 100%;
    min-height: 160px;
    padding: 12px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  button {
    font: inherit;
    font-weight: 600;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button:hover:not(:disabled) { background: #2c3849; border-color: #46566b; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  button.primary { background: var(--accent); border-color: var(--accent); color: #07121c; }
  button.primary:hover:not(:disabled) { background: #7cc4f8; border-color: #7cc4f8; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* ---------- loading ---------- */
  .bar {
    height: 8px;
    background: var(--surface-2);
    border-radius: 99px;
    overflow: hidden;
    margin: 14px 0 8px;
  }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }
  .step { color: var(--muted); font-size: .875rem; }

  .tally { display: flex; gap: 20px; flex-wrap: wrap; margin: 4px 0 12px; }
  .tally b { font-size: 1.5rem; display: block; line-height: 1.2; }
  .tally .ok b { color: var(--good); }
  .tally .no b { color: var(--warn); }
  .tally span { color: var(--muted); font-size: .8125rem; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font: 13px/1 ui-monospace, Menlo, monospace;
    padding: 6px 9px;
    border-radius: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .notice {
    border-left: 3px solid var(--warn);
    background: rgba(242, 180, 92, .08);
    padding: 10px 14px;
    border-radius: 0 8px 8px 0;
    color: var(--warn);
    font-size: .875rem;
  }

  /* ---------- game ---------- */
  .board { display: flex; gap: 24px; align-items: flex-start; }
  .board svg { flex: none; width: 190px; height: 210px; }
  .board .info { flex: 1; min-width: 0; }

  .gallows { stroke: var(--muted); stroke-width: 5; stroke-linecap: round; fill: none; }
  .part { stroke: var(--text); stroke-width: 5; stroke-linecap: round; fill: none; opacity: 0; transition: opacity .25s; }
  .part.show { opacity: 1; }
  .part.dead { stroke: var(--bad); }

  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .lives { font-size: .875rem; color: var(--muted); }
  .lives b { color: var(--text); }

  .seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .seg button {
    border: 0;
    border-radius: 0;
    padding: 6px 13px;
    font-size: .8125rem;
    background: transparent;
    color: var(--muted);
  }
  .seg button.on { background: var(--accent); color: #07121c; }
  .seg button:hover:not(.on) { background: var(--surface-2); color: var(--text); }

  .voice-ctl {
    display: flex;
    gap: 8px 18px;
    flex-wrap: wrap;
    align-items: center;
    padding: 10px 14px;
    margin-top: 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: .8125rem;
    color: var(--muted);
  }
  .voice-ctl > span { font-weight: 600; color: var(--text); }
  .voice-ctl label { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 500; }
  .voice-ctl input[type="range"] {
    width: 108px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .voice-ctl output {
    font: 600 .8125rem/1 ui-monospace, Menlo, monospace;
    color: var(--text);
    min-width: 2.6em;
  }
  .voice-ctl select {
    font: inherit;
    font-size: .8125rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    max-width: 210px;
    cursor: pointer;
  }
  .voice-ctl button { padding: 5px 11px; font-size: .75rem; font-weight: 500; }
  .voice-ctl.off { opacity: .45; }

  .defs { margin: 0; padding: 0; list-style: none; max-height: 210px; overflow-y: auto; }
  .defs li { display: flex; gap: 8px; margin-bottom: 8px; font-size: .9375rem; }
  /* A cloze runs as prose, unlike the flex rows the definitions use. */
  .defs li.cloze { display: block; font-size: 1rem; line-height: 1.75; }
  .blank {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .12em;
    color: var(--accent);
    border-bottom: 1px solid var(--accent);
    padding: 0 3px;
    white-space: nowrap;
  }
  .blank.filled { letter-spacing: normal; font-weight: 700; }
  .pos {
    flex: none;
    font-size: .6875rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--accent);
    background: rgba(93, 180, 245, .12);
    border-radius: 4px;
    padding: 3px 6px;
    height: fit-content;
    margin-top: 3px;
  }

  .answer {
    font: 700 clamp(1.5rem, 7vw, 2.25rem)/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .35em;
    text-align: center;
    padding: 18px 0 14px;
    word-break: break-all;
  }
  .answer .miss { color: var(--bad); }
  /* Strict mode: mark the one position that must be typed next. */
  .answer .cursor { color: var(--accent); animation: caret 1.1s ease-in-out infinite; }
  @keyframes caret { 50% { opacity: .3; } }

  .keys {
    --gap: 6px;
    /* The top row has 10 keys, so size every key to what that row can take. */
    --key: min(44px, calc((min(100vw - 72px, 740px) - 9 * var(--gap)) / 10));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--gap);
  }
  .krow { display: flex; gap: var(--gap); }
  .keys button {
    padding: 0;
    width: var(--key);
    height: var(--key);
    font-size: calc(var(--key) * .42);
    text-transform: uppercase;
    min-width: 0;
  }
  .keys button.bad { animation: badkey .45s ease-out; }
  @keyframes badkey {
    0%   { background: rgba(240, 97, 109, .55); border-color: var(--bad); }
    100% { background: var(--surface-2); border-color: var(--border); }
  }
  .keys button.hit { background: rgba(70, 200, 138, .18); border-color: var(--good); color: var(--good); }
  .keys button.miss { background: transparent; border-color: var(--border); color: #5b6a7d; }

  .result { text-align: center; padding: 6px 0 2px; }
  .result h2 { margin: 0 0 6px; font-size: 1.25rem; }
  .result.win h2 { color: var(--good); }
  .result.lose h2 { color: var(--bad); }
  .result p { margin: 0 0 14px; color: var(--muted); font-size: .9375rem; }
  .result .word { color: var(--text); font-weight: 700; letter-spacing: .06em; }

  .scoreline { color: var(--muted); font-size: .8125rem; text-align: center; }

  @media (max-width: 620px) {
    .board { flex-direction: column; align-items: center; gap: 12px; }
    .board svg { width: 150px; height: 170px; }
    .board .info { width: 100%; }
    .card { padding: 14px; }
    .keys { --gap: 5px; --key: min(40px, calc((100vw - 60px - 9 * var(--gap)) / 10)); }
    .defs { max-height: 150px; }
  }
</style>
</head>
<body>
<main>
  <h1><span class="only-plain">Hangman 單字遊戲</span><span class="only-cloze">Hangman 克漏字</span></h1>
  <p class="sub"><span class="only-plain">離線字典 · 看釋義猜單字 · 中英文可隨時切換</span><span class="only-cloze">離線 · 看例句猜單字</span></p>

  <!-- ============ 設定 ============ -->
  <section id="setup" class="active">
    <div class="card">
      <label for="bank-input">遊戲字庫</label>
      <p class="hint">用半形逗點、空白或換行分隔每個單字。查不到釋義的字會自動略過。</p>
      <textarea id="bank-input" spellcheck="false" autocapitalize="off"
                placeholder="ability,serendipity cat&#10;hangman"></textarea>
      <div class="row" style="margin-top:14px">
        <button id="start" class="primary">開始遊戲</button>
        <button id="resume" hidden></button>
      </div>
      <p id="setup-error" class="notice" style="margin-top:14px" hidden></p>
    </div>
  </section>

  <!-- ============ 載入 ============ -->
  <section id="loading">
    <div class="card">
      <strong id="load-title">正在準備遊戲</strong>
      <div class="bar"><i id="load-bar"></i></div>
      <p class="step" id="load-step">載入字典中…</p>

      <div id="load-result" hidden>
        <div class="tally">
          <div class="ok"><b id="count-ok">0</b><span>可出題</span></div>
          <div class="no"><b id="count-no">0</b><span class="only-plain">查無釋義</span><span class="only-cloze">無題目</span></div>
        </div>
        <div id="missing-wrap" hidden>
          <p class="step only-plain">以下單字不在字典中，不會出現在測驗裡：</p>
          <p class="step only-cloze">以下單字目前沒有克漏字題目，不會出現在測驗裡：</p>
          <div class="chips" id="missing-list"></div>
        </div>
        <p id="load-error" class="notice" style="margin-top:14px" hidden></p>
        <div class="row" style="margin-top:16px">
          <button id="play" class="primary">開始猜字</button>
          <button id="back">回上一步</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 遊戲 ============ -->
  <section id="game">
    <div class="card">
      <div class="board">
        <svg viewBox="0 0 190 210" aria-hidden="true">
          <g class="gallows">
            <path d="M15 200 H105"/>
            <path d="M40 200 V15"/>
            <path d="M40 15 H125"/>
            <path d="M125 15 V40"/>
          </g>
          <circle class="part" data-part="0" cx="125" cy="60" r="20"/>
          <path   class="part" data-part="1" d="M125 80 V135"/>
          <path   class="part" data-part="2" d="M125 95 L95 120"/>
          <path   class="part" data-part="3" d="M125 95 L155 120"/>
          <path   class="part" data-part="4" d="M125 135 L100 175"/>
          <path   class="part" data-part="5" d="M125 135 L150 175"/>
        </svg>

        <div class="info">
          <div class="meta">
            <button id="say" title="播放發音">🔊 發音</button>
            <div class="seg only-plain" id="lang">
              <button type="button" data-lang="zh">中文</button>
              <button type="button" data-lang="en">EN</button>
            </div>
            <div class="seg" id="mode">
              <button type="button" data-mode="easy" title="輸入字母，揭露所有符合的位置">簡易</button>
              <button type="button" data-mode="strict" title="必須依照正確拼字順序輸入">嚴格</button>
            </div>
            <span class="lives">剩餘機會 <b id="lives">6</b></span>
          </div>
          <ul class="defs" id="defs"></ul>
        </div>
      </div>

      <div class="voice-ctl" id="voice-ctl">
        <span>發音設定</span>
        <label>語音
          <select id="voice"></select>
        </label>
        <label>音調
          <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
          <output id="pitch-val">1.0</output>
        </label>
        <label>語速
          <input type="range" id="rate" min="0.5" max="2" step="0.05" value="0.9">
          <output id="rate-val">0.90</output>
        </label>
        <button id="voice-reset" type="button">重設</button>
      </div>

      <div class="answer" id="answer"></div>

      <div id="play-area">
        <div class="keys" id="keys"></div>
      </div>

      <div id="round-end" hidden>
        <div class="result" id="result">
          <h2 id="result-title"></h2>
          <p>答案是 <span class="word" id="result-word"></span></p>
          <div class="row" style="justify-content:center">
            <button id="next" class="primary">下一題</button>
            <button id="quit">換字庫</button>
          </div>
        </div>
      </div>

      <p class="scoreline" id="scoreline" style="margin-top:16px"></p>
    </div>
  </section>
</main>

  const MAX_WRONG = 6;
  // The two games share an origin (on Pages, and on file:// in most browsers),
  // so their saved state would collide without separate prefixes. The voice is
  // shared on purpose: it describes the device, not the game.
  const PREFIX = CLOZE ? "hangman-cloze:v1:" : "hangman:v1:";
  const BANK_KEY = PREFIX + "bank";
  const STATS_KEY = PREFIX + "stats";
  const MODE_KEY = PREFIX + "mode";
  const LANG_KEY = "hangman:v1:lang";     // only the definitions game has one
  const VOICE_KEY = "hangman:v1:voice";

  const VOICE_DEFAULTS = { pitch: 1, rate: 0.9, uri: null };

  const $ = (id) => document.getElementById(id);

  const state = {
    pool: null,      // what bank words are matched against: dict, or cloze
    dict: null,      // word -> [[definition, part-of-speech], ...]
    cloze: null,     // base -> [[answer, sentence, definition, part-of-speech], ...]
    hint: null,      // cloze game: this round's { sentence, definition, pos }
    zhDict: null,    // word -> Traditional Chinese gloss
    lang: "zh",      // which one the definition panel shows
    bank: [],          // words that made it into the question pool
    missing: [],       // words with no dictionary entry
    bag: [],           // shuffled queue; refilled when exhausted
    word: "",        // the bank word: what gets looked up and saved
    answer: "",      // what the player spells; equals `word` in the definitions game
    defs: [],
    guessed: new Set(),   // easy mode only: letters already tried
    revealed: [],         // per position; the shared truth both modes write to
    mode: "easy",         // easy = reveal every match | strict = spell in order
    wrong: 0,
    phase: "playing",  // playing | won | lost
    stats: { played: 0, won: 0, lost: 0 },
    voice: { ...VOICE_DEFAULTS },  // live TTS pitch/rate, adjustable mid-game
  };

  /* ---------------- storage (all optional; private mode can throw) --------- */

  function readStore(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      return null;
    }
  }

  function writeStore(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (err) {
      /* quota or private mode - the game still works, it just won't persist */
    }
  }

  /* ---------------- dictionary ---------------- */

  async function inflate(b64) {
    if (typeof DecompressionStream !== "function") {
      throw new Error("你的瀏覽器不支援 DecompressionStream，請改用 Chrome 80+ / Safari 16.4+ / Firefox 113+。");
    }
    const binary = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const stream = new Blob([binary]).stream().pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(stream).text());
  }

  /* ---------------- word bank ---------------- */

  // Half-width comma / space / newline all separate entries.
  function parseBank(raw) {
    const seen = new Set();
    for (const token of raw.split(/[,\s]+/)) {
      const word = token.trim().toLowerCase();
      if (word) seen.add(word);
    }
    return [...seen];
  }

  function shuffle(items) {
    const out = items.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  /* ---------------- screens ---------------- */

  function show(name) {
    for (const id of ["setup", "loading", "game"]) {
      $(id).classList.toggle("active", id === name);
    }
  }

  /* ---------------- setup ---------------- */

  function initSetup() {
    const saved = readStore(BANK_KEY);
    if (saved && Array.isArray(saved.words) && saved.words.length) {
      const resume = $("resume");
      resume.hidden = false;
      resume.textContent = `沿用上次字庫（${saved.words.length} 個字）`;
      resume.onclick = () => beginLoading(saved.words);
    }

    $("start").onclick = () => {
      const words = parseBank($("bank-input").value);
      const error = $("setup-error");
      if (!words.length) {
        error.hidden = false;
        error.textContent = "請先輸入至少一個單字。";
        return;
      }
      error.hidden = true;
      beginLoading(words);
    };
  }

  /* ---------------- loading ---------------- */

  const nextFrame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));

  async function beginLoading(words) {
    show("loading");
    $("load-result").hidden = true;
    $("load-error").hidden = true;
    $("missing-wrap").hidden = true;
    $("load-bar").style.width = "0%";
    $("load-step").textContent = "載入字典中…";
    await nextFrame();

    try {
      if (!state.pool) {
        if (CLOZE) {
          state.cloze = await inflate(CLOZE_B64);
          state.pool = state.cloze;
        } else {
          const [en, zh] = await Promise.all([inflate(DICT_B64), inflate(ZH_B64)]);
          state.dict = en;
          state.zhDict = zh;
          state.pool = en;
        }
      }
    } catch (err) {
      $("load-step").textContent = "字典載入失敗";
      $("load-result").hidden = false;
      $("load-error").hidden = false;
      $("load-error").textContent = err.message;
      $("play").disabled = true;
      return;
    }

    const found = [];
    const missing = [];
    for (let i = 0; i < words.length; i++) {
      const word = words[i];
      if (Object.prototype.hasOwnProperty.call(state.pool, word)) found.push(word);
      else missing.push(word);

      const done = i + 1;
      $("load-bar").style.width = `${Math.round((done / words.length) * 100)}%`;
      $("load-step").textContent = `比對單字 ${done} / ${words.length}`;
      // Yield often enough that the progress bar is actually visible.
      if (done % 10 === 0 || done === words.length) await nextFrame();
    }

    state.bank = found;
    state.missing = missing;
    writeStore(BANK_KEY, { words, missing, savedAt: new Date().toISOString() });

    $("load-step").textContent = "準備完成";
    $("count-ok").textContent = String(found.length);
    $("count-no").textContent = String(missing.length);
    $("load-result").hidden = false;

    if (missing.length) {
      $("missing-wrap").hidden = false;
      $("missing-list").replaceChildren(
        ...missing.map((word) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = word;
          return chip;
        })
      );
    }

    const playable = found.length > 0;
    $("play").disabled = !playable;
    if (!playable) {
      $("load-error").hidden = false;
      $("load-error").textContent = CLOZE
        ? "沒有任何單字有克漏字題目，無法開始遊戲。請換一批單字。"
        : "沒有任何單字查得到釋義，無法開始遊戲。請換一批單字。";
    }
  }

  function initLoading() {
    $("back").onclick = () => show("setup");
    $("play").onclick = () => {
      state.stats = readStore(STATS_KEY) || { played: 0, won: 0, lost: 0 };
      state.bag = [];
      show("game");
      nextRound();
    };
  }

  /* ---------------- round ---------------- */

  function nextRound() {
    if (!state.bag.length) state.bag = shuffle(state.bank);
    state.word = state.bag.pop();
    if (CLOZE) {
      // One of the word's clozes at random; its answer may be inflected
      // ("fell" for "fall"), and that form is what the player spells.
      const options = state.cloze[state.word];
      const [answer, sentence, definition, pos] = options[Math.floor(Math.random() * options.length)];
      state.answer = answer;
      state.hint = { sentence, definition, pos };
    } else {
      state.answer = state.word;
      state.defs = state.dict[state.word] || [];
    }
    state.guessed = new Set();
    // Non-letters (hyphens) are never guessed, so they start revealed.
    state.revealed = [...state.answer].map((ch) => !isLetter(ch));
    state.wrong = 0;
    state.phase = "playing";

    renderDefs();
    buildKeys();
    render();
  }

  const KEY_ROWS = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];

  // A Chinese line looks like "n. 能力, 才幹" or "[計] 電腦"; split the marker
  // off so it can share the same badge styling as the English part-of-speech.
  const ZH_MARKER = /^\s*(\[[^\]]+\]|[a-z]+\.)\s*([\s\S]*)$/;

  function defItem(marker, body) {
    const li = document.createElement("li");
    if (marker) {
      const tag = document.createElement("span");
      tag.className = "pos";
      tag.textContent = marker;
      li.append(tag);
    }
    const text = document.createElement("span");
    text.textContent = body;
    li.append(text);
    return li;
  }

  // The blank is as wide as the answer - the inflected form - so its width is
  // an honest clue: "expecting" gets nine underscores, not six.
  function clozeItem(sentence) {
    const li = document.createElement("li");
    li.className = "cloze";
    const [before, after = ""] = sentence.split("{{blank}}");
    const blank = document.createElement("span");
    blank.className = "blank";
    li.append(document.createTextNode(before), blank, document.createTextNode(after));
    return li;
  }

  function renderBlank() {
    const blank = $("defs").querySelector(".blank");
    if (!blank) return;
    // Once the round is over the sentence reads whole, so it can be learned as written.
    const over = state.phase !== "playing";
    blank.classList.toggle("filled", over);
    blank.textContent = over
      ? state.answer
      : [...state.answer].map((ch) => (isLetter(ch) ? "_" : ch)).join("");
  }

  function renderDefs() {
    if (CLOZE) {
      $("defs").replaceChildren(
        clozeItem(state.hint.sentence),
        defItem(state.hint.pos, state.hint.definition)
      );
      renderBlank();
      return;
    }

    const zh = state.zhDict ? state.zhDict[state.word] : null;
    // Every bundled word has a Chinese gloss, but fall back rather than show
    // an empty panel if one is ever missing.
    const useZh = state.lang === "zh" && zh;

    $("defs").replaceChildren(
      ...(useZh
        ? zh.split("\n").filter(Boolean).map((line) => {
            const m = ZH_MARKER.exec(line);
            return m ? defItem(m[1], m[2]) : defItem("", line);
          })
        : state.defs.map(([definition, pos]) => defItem(pos, definition)))
    );

    if (!CLOZE) {
      for (const button of $("lang").children) {
        button.classList.toggle("on", button.dataset.lang === state.lang);
      }
    }
  }

  function setLang(lang) {
    state.lang = lang;
    writeStore(LANG_KEY, lang);
    renderDefs();
  }

  function buildKeys() {
    $("keys").replaceChildren(
      ...KEY_ROWS.map((row) => {
        const line = document.createElement("div");
        line.className = "krow";
        for (const letter of row) {
          const button = document.createElement("button");
          button.textContent = letter;
          button.dataset.letter = letter;
          button.onclick = () => guess(letter);
          line.append(button);
        }
        return line;
      })
    );
  }

  function isLetter(ch) {
    return ch >= "a" && ch <= "z";
  }

  // Strict mode: the one position that has to be typed next, or -1 when done.
  function nextSlot() {
    return state.revealed.indexOf(false);
  }

  function guessStrict(letter) {
    const slot = nextSlot();
    if (slot === -1) return;
    if (state.answer[slot] === letter) {
      state.revealed[slot] = true;
    } else {
      state.wrong++;
      flashKey(letter);
    }
  }

  function guessEasy(letter) {
    if (state.guessed.has(letter)) return;
    state.guessed.add(letter);
    let hit = false;
    for (let i = 0; i < state.answer.length; i++) {
      if (state.answer[i] === letter) {
        state.revealed[i] = true;
        hit = true;
      }
    }
    if (!hit) state.wrong++;
  }

  function guess(letter) {
    if (state.phase !== "playing") return;

    // Strict mode deliberately does not touch `guessed`: a letter that is wrong
    // now can be right later (ability needs "i" twice), so marking it spent or
    // colouring it would both mislead and block the player.
    if (state.mode === "strict") guessStrict(letter);
    else guessEasy(letter);

    if (state.revealed.every(Boolean)) finish("won");
    else if (state.wrong >= MAX_WRONG) finish("lost");
    else render();
  }

  function flashKey(letter) {
    const button = $("keys").querySelector(`[data-letter="${letter}"]`);
    if (!button) return;
    button.classList.remove("bad");
    void button.offsetWidth; // restart the animation on a repeated wrong key
    button.classList.add("bad");
    setTimeout(() => button.classList.remove("bad"), 450);
  }

  function setMode(mode) {
    state.mode = mode;
    writeStore(MODE_KEY, mode);
    render();
  }

  function finish(phase) {
    state.phase = phase;
    state.stats.played++;
    state.stats[phase === "won" ? "won" : "lost"]++;
    writeStore(STATS_KEY, state.stats);
    render();
  }

  function render() {
    const over = state.phase !== "playing";
    const lost = state.phase === "lost";
    if (CLOZE) renderBlank();

    const strict = state.mode === "strict";
    const slot = strict && !over ? nextSlot() : -1;

    const answer = $("answer");
    answer.replaceChildren(
      ...[...state.answer].map((ch, i) => {
        const span = document.createElement("span");
        const known = state.revealed[i];
        span.textContent = known ? ch : lost ? ch : "_";
        if (lost && !known) span.className = "miss";
        else if (i === slot) span.className = "cursor";
        return span;
      })
    );

    $("lives").textContent = String(MAX_WRONG - state.wrong);

    for (const part of document.querySelectorAll(".part")) {
      const index = Number(part.dataset.part);
      part.classList.toggle("show", index < state.wrong);
      part.classList.toggle("dead", lost);
    }

    for (const button of $("keys").querySelectorAll("button")) {
      const letter = button.dataset.letter;
      // In strict mode every key stays live and uncoloured; only easy mode
      // spends a letter permanently.
      const used = !strict && state.guessed.has(letter);
      button.classList.toggle("hit", used && state.answer.includes(letter));
      button.classList.toggle("miss", used && !state.answer.includes(letter));
      button.disabled = over || used;
    }

    for (const button of $("mode").children) {
      button.classList.toggle("on", button.dataset.mode === state.mode);
    }

    $("play-area").hidden = over;
    $("round-end").hidden = !over;
    if (over) {
      $("result").className = `result ${state.phase === "won" ? "win" : "lose"}`;
      $("result-title").textContent = state.phase === "won" ? "答對了！" : "可惜，機會用完了";
      // In the cloze game the answer can be an inflection of the bank word.
      $("result-word").textContent =
        state.answer === state.word ? state.answer : `${state.answer} ← ${state.word}`;
      $("next").focus();
    }

    const { played, won, lost: lostCount } = state.stats;
    $("scoreline").textContent = `已完成 ${played} 題 · 答對 ${won} · 答錯 ${lostCount}`;
  }

  /* ---------------- pronunciation (Web Speech API) ---------------- */

  let voice = null;          // the voice currently in use
  let englishVoices = [];    // every English voice the browser offers

  const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));

  // Some platforms report "en_US" instead of "en-US".
  const langOf = (v) => (v.lang || "").replace(/_/g, "-").toLowerCase();
  const isEnglish = (v) => langOf(v).startsWith("en");

  // macOS ships a pile of joke voices, and they sort to the very top of the
  // en-US list - "Albert" is literally first, "Bad News" intones like a
  // funeral. They stay selectable, but they must never be picked for you.
  const NOVELTY = new Set([
    "albert", "bad news", "bahh", "bells", "boing", "bruce", "bubbles", "cellos",
    "deranged", "fred", "good news", "hysterical", "jester", "junior", "kathy",
    "organ", "princess", "ralph", "superstar", "trinoids", "whisper", "wobble",
    "zarvox",
  ]);

  const PREFERRED = [
    "samantha", "alex", "ava", "allison", "susan", "google us english",
    "microsoft aria", "microsoft zira", "microsoft jenny",
    "daniel", "karen", "moira", "tessa", "serena",
  ];

  const ACCENTS = {
    "en-us": "美式", "en-gb": "英式", "en-au": "澳洲", "en-ie": "愛爾蘭",
    "en-za": "南非", "en-in": "印度", "en-nz": "紐西蘭",
  };

  const isNovelty = (v) => NOVELTY.has(v.name.trim().toLowerCase());

  function preferenceRank(v) {
    const name = v.name.trim().toLowerCase();
    const index = PREFERRED.findIndex((p) => name === p || name.startsWith(p));
    return index === -1 ? Infinity : index;
  }

  function autoPickVoice() {
    const preferred = englishVoices
      .filter((v) => preferenceRank(v) !== Infinity)
      .sort((a, b) => preferenceRank(a) - preferenceRank(b));
    return (
      preferred[0] ||
      englishVoices.find((v) => v.default) ||
      englishVoices.find((v) => !isNovelty(v)) ||
      englishVoices[0] ||
      null
    );
  }

  function voiceLabel(v) {
    return `${v.name}（${ACCENTS[langOf(v)] || v.lang}）`;
  }

  function buildVoiceMenu() {
    const groups = [
      ["建議", englishVoices.filter((v) => preferenceRank(v) !== Infinity)
                            .sort((a, b) => preferenceRank(a) - preferenceRank(b))],
      ["其他英文語音", englishVoices.filter((v) => preferenceRank(v) === Infinity && !isNovelty(v))],
      ["特效語音", englishVoices.filter((v) => preferenceRank(v) === Infinity && isNovelty(v))],
    ];

    $("voice").replaceChildren(
      ...groups.filter(([, list]) => list.length).map(([label, list]) => {
        const group = document.createElement("optgroup");
        group.label = label;
        for (const v of list) {
          const option = document.createElement("option");
          option.value = v.voiceURI;
          option.textContent = voiceLabel(v);
          group.append(option);
        }
        return group;
      })
    );
    if (voice) $("voice").value = voice.voiceURI;
  }

  function refreshVoices() {
    if (!("speechSynthesis" in window)) return;
    const all = speechSynthesis.getVoices();
    if (!all.length) return; // Chrome populates this asynchronously

    englishVoices = all.filter(isEnglish);
    if (!englishVoices.length) {
      voice = null;
      setSpeechEnabled(false, "找不到英文語音");
      return;
    }

    // voiceschanged can fire repeatedly; never clobber an explicit choice.
    const chosen = state.voice.uri && englishVoices.find((v) => v.voiceURI === state.voice.uri);
    if (chosen) voice = chosen;
    else if (!voice || !englishVoices.includes(voice)) voice = autoPickVoice();

    buildVoiceMenu();
    setSpeechEnabled(true, voice ? `合成語音（${voice.name}）` : "使用瀏覽器預設語音");
  }

  function setSpeechEnabled(enabled, reason) {
    $("say").disabled = !enabled;
    $("say").title = reason;
    $("voice-ctl").classList.toggle("off", !enabled);
    for (const el of [$("voice"), $("pitch"), $("rate"), $("voice-reset")]) {
      el.disabled = !enabled;
    }
  }

  function speak() {
    if (!state.answer || !("speechSynthesis" in window)) return;
    const utterance = new SpeechSynthesisUtterance(state.answer);
    if (voice) utterance.voice = voice;
    utterance.lang = voice ? voice.lang : "en-US";
    utterance.pitch = state.voice.pitch;
    utterance.rate = state.voice.rate;
    speechSynthesis.cancel(); // don't let repeated clicks stack up
    speechSynthesis.speak(utterance);
  }

  function syncVoiceUI() {
    $("pitch").value = String(state.voice.pitch);
    $("rate").value = String(state.voice.rate);
    $("pitch-val").textContent = state.voice.pitch.toFixed(1);
    $("rate-val").textContent = state.voice.rate.toFixed(2);
    if (voice) $("voice").value = voice.voiceURI;
  }

  function setVoiceSetting(name, raw, lo, hi) {
    const value = Number(raw);
    if (!Number.isFinite(value)) return;
    state.voice[name] = clamp(value, lo, hi);
    syncVoiceUI();
    writeStore(VOICE_KEY, state.voice);
  }

  function initSpeech() {
    const saved = readStore(VOICE_KEY);
    if (saved) {
      if (Number.isFinite(saved.pitch)) state.voice.pitch = clamp(saved.pitch, 0, 2);
      if (Number.isFinite(saved.rate)) state.voice.rate = clamp(saved.rate, 0.5, 2);
      if (typeof saved.uri === "string") state.voice.uri = saved.uri;
    }
    syncVoiceUI();

    // Dragging updates the label live; releasing replays the word so the
    // change can actually be heard.
    $("pitch").addEventListener("input", (e) => setVoiceSetting("pitch", e.target.value, 0, 2));
    $("rate").addEventListener("input", (e) => setVoiceSetting("rate", e.target.value, 0.5, 2));
    $("pitch").addEventListener("change", speak);
    $("rate").addEventListener("change", speak);

    $("voice").addEventListener("change", (e) => {
      const picked = englishVoices.find((v) => v.voiceURI === e.target.value);
      if (!picked) return;
      voice = picked;
      state.voice.uri = picked.voiceURI;
      writeStore(VOICE_KEY, state.voice);
      $("say").title = `合成語音（${picked.name}）`;
      speak();
    });

    $("voice-reset").onclick = () => {
      state.voice = { ...VOICE_DEFAULTS };
      voice = autoPickVoice();
      syncVoiceUI();
      buildVoiceMenu();
      writeStore(VOICE_KEY, state.voice);
      speak();
    };

    $("say").onclick = speak;

    if (!("speechSynthesis" in window)) {
      setSpeechEnabled(false, "此瀏覽器不支援語音合成");
      return;
    }
    refreshVoices();
    speechSynthesis.addEventListener("voiceschanged", refreshVoices);
  }

  /* ---------------- wiring ---------------- */

  function initGame() {
    if (CLOZE) {
      $("lang").remove();  // the cloze game is English only
    } else {
      const savedLang = readStore(LANG_KEY);
      if (savedLang === "en" || savedLang === "zh") state.lang = savedLang;
      for (const button of $("lang").children) {
        button.onclick = () => {
          setLang(button.dataset.lang);
          button.blur(); // keep Space/Enter meaning "next round", not "toggle"
        };
      }
    }

    const savedMode = readStore(MODE_KEY);
    if (savedMode === "easy" || savedMode === "strict") state.mode = savedMode;
    for (const button of $("mode").children) {
      button.onclick = () => {
        setMode(button.dataset.mode);
        button.blur();
      };
    }

    $("next").onclick = nextRound;
    $("quit").onclick = () => show("setup");

    document.addEventListener("keydown", (event) => {
      if (!$("game").classList.contains("active")) return;
      if (event.ctrlKey || event.metaKey || event.altKey) return;

      if (state.phase !== "playing") {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          nextRound();
        }
        return;
      }
      if (event.key === " ") {
        // Space is the pronounce shortcut mid-round. preventDefault also stops
        // it re-activating whatever button still holds focus: in strict mode the
        // on-screen keys stay enabled, so a clicked key would otherwise fire
        // again and cost a life.
        event.preventDefault();
        speak();
        return;
      }

      const key = event.key.toLowerCase();
      if (key.length === 1 && isLetter(key)) {
        event.preventDefault();
        guess(key);
      }
    });
  }

  initSetup();
  initLoading();
  initGame();
  initSpeech();
})();
</script>
</body>
</html>
